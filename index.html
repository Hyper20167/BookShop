<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lolo's Bookstore 📚</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eee5ff, #faf7ff);
    color: #222;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #6b35d9, #aa70ff);
    color: white;
    text-align: center;
    padding: 45px 20px;
}

header h1 {
    margin: 0;
    font-size: 48px;
}

header p {
    font-size: 19px;
}

/* NAV */

nav {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
}

nav button {
    background: #7139df;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 11px;
    font-weight: bold;
    cursor: pointer;
}

nav button:hover {
    background: #5423b7;
}

/* MAIN */

.container {
    width: 92%;
    max-width: 1200px;
    margin: 30px auto;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 25px;
}

/* BOOKS */

.books {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
}

.book {
    background: white;
    padding: 16px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    transition: .2s;
}

.book:hover {
    transform: translateY(-6px);
}

.book img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 14px;
}

.book h2 {
    margin-bottom: 8px;
}

.description {
    color: #666;
    min-height: 45px;
}

.price {
    color: #7139df;
    font-size: 25px;
    font-weight: bold;
    margin: 15px;
}

/* BUY */

.buy {
    width: 90%;
    background: #25D366;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 11px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.buy:hover {
    background: #1da851;
}

/* DELETE */

.delete {
    margin-top: 10px;
    background: #e53935;
    color: white;
    border: none;
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
}

/* PANELS */

.panel {
    display: none;
    background: white;
    padding: 25px;
    margin-bottom: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    min-height: 160px;
    resize: vertical;
}

label {
    font-weight: bold;
}

.primary {
    background: #7139df;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 11px;
    font-weight: bold;
    cursor: pointer;
}

.primary:hover {
    background: #5423b7;
}

.close {
    background: #777;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 10px;
    margin-left: 5px;
    cursor: pointer;
}

.message {
    font-weight: bold;
}

.success {
    color: green;
}

.error {
    color: red;
}

/* BOOK READER */

#reader {
    display: none;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    margin-bottom: 30px;
}

#reader h2 {
    color: #7139df;
}

#readerText {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 18px;
}

/* FOOTER */

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 35px;
    margin-top: 60px;
}

/* MOBILE */

@media(max-width:600px) {

    header h1 {
        font-size: 35px;
    }

    .book img {
        height: 260px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>📚 Lolo's Bookstore</h1>

    <p>
        Discover amazing books!
    </p>

</header>


<!-- NAVIGATION -->

<nav>

    <button onclick="showOwnerLogin()">
        🔐 My Book Studio
    </button>

</nav>


<div class="container">


<!-- PASSWORD -->

<div
    id="passwordPanel"
    class="panel"
>

    <h2>🔐 Owner Area</h2>

    <p>
        Enter your password.
    </p>

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button
        class="primary"
        onclick="checkPassword()"
    >
        Enter
    </button>

    <button
        class="close"
        onclick="closePassword()"
    >
        Cancel
    </button>

    <p
        id="passwordMessage"
        class="message"
    ></p>

</div>


<!-- BOOK STUDIO -->

<div
    id="studio"
    class="panel"
>

    <h2>✍️ Create Your Own Book</h2>

    <p>
        Write your book here and add it to your bookstore!
    </p>


    <label>
        📖 Book Title
    </label>

    <input
        id="title"
        type="text"
        placeholder="Enter your book title"
    >


    <label>
        💰 Price
    </label>

    <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Example: 5"
    >


    <label>
        🖼️ Book Cover URL
    </label>

    <input
        id="image"
        type="url"
        placeholder="Paste your cover image URL"
    >


    <label>
        📝 Short Description
    </label>

    <textarea
        id="description"
        placeholder="Write a short description of your book..."
    ></textarea>


    <label>
        ✍️ Write Your Book
    </label>

    <textarea
        id="bookText"
        placeholder="Start writing your book here...

Chapter 1

Once upon a time...

Chapter 2

..."
        style="min-height:300px;"
    ></textarea>


    <button
        class="primary"
        onclick="createBook()"
    >
        📚 Add My Book
    </button>


    <button
        class="close"
        onclick="closeStudio()"
    >
        Close
    </button>


    <p
        id="addMessage"
        class="message"
    ></p>

</div>


<!-- BOOK READER -->

<div id="reader">

    <h2 id="readerTitle"></h2>

    <p id="readerText"></p>

    <button
        class="close"
        onclick="closeReader()"
    >
        ← Back to Store
    </button>

</div>


<!-- STORE -->

<h2 class="section-title">
    📚 Books For Sale
</h2>


<div
    id="books"
    class="books"
></div>


</div>


<!-- FOOTER -->

<footer>

    <h2>
        📚 Lolo's Bookstore
    </h2>

    <p>
        Made with ❤️
    </p>

    <p>
        💬 Orders are made through WhatsApp
    </p>

</footer>


<script>


/* =========================================
   WHATSAPP
========================================= */

const WHATSAPP_NUMBER =
    "201026103853";


/* =========================================
   BOOK DATA
========================================= */

let books = JSON.parse(
    localStorage.getItem("loloBooks")
) || [

    {
        title: "The Mystery Key",

        price: 5,

        image:
        "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=800",

        description:
        "A mysterious adventure about twins who discover a glowing key.",

        text:
        "Once upon a time, two twins discovered a mysterious glowing key..."
    },


    {
        title: "Dragon Island",

        price: 7,

        image:
        "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800",

        description:
        "An exciting adventure on a mysterious island.",

        text:
        "Far across the ocean was a mysterious island where dragons lived..."
    }

];


/* =========================================
   DISPLAY BOOKS
========================================= */

function displayBooks() {

    const container =
        document.getElementById("books");

    container.innerHTML = "";


    if (books.length === 0) {

        container.innerHTML = `

            <div style="text-align:center;">

                <h2>
                    📚 No books yet!
                </h2>

                <p>
                    Create your first book!
                </p>

            </div>

        `;

        return;
    }


    books.forEach((book, index) => {

        const card =
            document.createElement("div");

        card.className = "book";


        card.innerHTML = `

            <img
                src="${escapeHTML(book.image)}"
                alt="${escapeHTML(book.title)}"
                onerror="
                this.src='https://via.placeholder.com/600x800?text=Book'
                "
            >


            <h2>
                ${escapeHTML(book.title)}
            </h2>


            <p class="description">

                ${escapeHTML(book.description)}

            </p>


            <div class="price">

                $${Number(book.price).toFixed(2)}

            </div>


            <button
                class="buy"
                onclick="buyBook(${index})"
            >

                💬 Buy on WhatsApp

            </button>


            <br>


            <button
                class="primary"
                style="margin-top:10px;"
                onclick="readBook(${index})"
            >

                📖 Read Book

            </button>


            <br>


            <button
                class="delete"
                onclick="deleteBook(${index})"
            >

                🗑️ Delete

            </button>

        `;


        container.appendChild(card);

    });

}


/* =========================================
   OWNER LOGIN
========================================= */

function showOwnerLogin() {

    document.getElementById(
        "passwordPanel"
    ).style.display = "block";

}


function closePassword() {

    document.getElementById(
        "passwordPanel"
    ).style.display = "none";

}


function checkPassword() {

    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "passwordMessage"
        );


    if (password === "book") {

        message.className =
            "message success";

        message.textContent =
            "✅ Correct!";


        document.getElementById(
            "passwordPanel"
        ).style.display = "none";


        document.getElementById(
            "studio"
        ).style.display = "block";


        document.getElementById(
            "password"
        ).value = "";


    } else {

        message.className =
            "message error";

        message.textContent =
            "❌ Wrong password!";

    }

}


/* =========================================
   CREATE BOOK
========================================= */

function createBook() {

    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "price"
            ).value
        );


    const image =
        document.getElementById(
            "image"
        ).value.trim();


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const text =
        document.getElementById(
            "bookText"
        ).value.trim();


    const message =
        document.getElementById(
            "addMessage"
        );


    if (!title) {

        message.className =
            "message error";

        message.textContent =
            "❌ Give your book a title.";

        return;
    }


    if (price <= 0) {

        message.className =
            "message error";

        message.textContent =
            "❌ Give your book a price.";

        return;
    }


    if (!image) {

        message.className =
            "message error";

        message.textContent =
            "❌ Add a cover image URL.";

        return;
    }


    if (!text) {

        message.className =
            "message error";

        message.textContent =
            "❌ Write something in your book.";

        return;
    }


    books.push({

        title: title,

        price: price,

        image: image,

        description:
            description ||
            "An amazing new book!",

        text: text

    });


    saveBooks();

    displayBooks();


    /* CLEAR FORM */

    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "price"
    ).value = "";


    document.getElementById(
        "image"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "bookText"
    ).value = "";


    message.className =
        "message success";

    message.textContent =
        "🎉 Your book has been added to the bookstore!";

}


function closeStudio() {

    document.getElementById(
        "studio"
    ).style.display = "none";

}


/* =========================================
   READ BOOK
========================================= */

function readBook(index) {

    const book = books[index];


    document.getElementById(
        "readerTitle"
    ).textContent =
        book.title;


    document.getElementById(
        "readerText"
    ).textContent =
        book.text;


    document.getElementById(
        "reader"
    ).style.display = "block";


    document.getElementById(
        "books"
    ).style.display = "none";


    document.querySelector(
        ".section-title"
    ).style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function closeReader() {

    document.getElementById(
        "reader"
    ).style.display = "none";


    document.getElementById(
        "books"
    ).style.display = "grid";


    document.querySelector(
        ".section-title"
    ).style.display = "block";

}


/* =========================================
   DELETE
========================================= */

function deleteBook(index) {

    if (
        !confirm(
            "Are you sure you want to delete this book?"
        )
    ) {

        return;

    }


    books.splice(index, 1);

    saveBooks();

    displayBooks();

}


/* =========================================
   SAVE
========================================= */

function saveBooks() {

    localStorage.setItem(
        "loloBooks",
        JSON.stringify(books)
    );

}


/* =========================================
   WHATSAPP ORDER
========================================= */

function buyBook(index) {

    const book =
        books[index];


    const message =

`📚 BOOK ORDER

Book: ${book.title}

Price: $${Number(book.price).toFixed(2)}

Hello! I would like to buy this book.`;


    const whatsappURL =

        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   START
========================================= */

displayBooks();

</script>

</body>
</html>
