<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lolo's Bookstore 📚</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eee5ff, #faf7ff);
    color: #222;
}

header {
    background: linear-gradient(135deg, #6b35d9, #aa70ff);
    color: white;
    text-align: center;
    padding: 45px 20px;
}

header h1 {
    margin: 0;
    font-size: 48px;
}

header p {
    font-size: 19px;
}

nav {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
}

nav button {
    background: #7139df;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 11px;
    font-weight: bold;
    cursor: pointer;
}

nav button:hover {
    background: #5423b7;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: 30px auto;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 25px;
}

.books {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
}

.book {
    background: white;
    padding: 16px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    transition: .2s;
}

.book:hover {
    transform: translateY(-6px);
}

.book img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 14px;
}

.book h2 {
    margin: 15px 0 6px;
}

.author {
    color: #666;
    font-size: 16px;
    margin-bottom: 10px;
}

.price {
    color: #7139df;
    font-size: 25px;
    font-weight: bold;
    margin: 15px;
}

.buy {
    width: 90%;
    background: #25D366;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 11px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.buy:hover {
    background: #1da851;
}

.read {
    width: 90%;
    margin-top: 10px;
    background: #7139df;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 11px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.read:hover {
    background: #5423b7;
}

.delete {
    margin-top: 10px;
    background: #e53935;
    color: white;
    border: none;
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
}

.panel {
    display: none;
    background: white;
    padding: 25px;
    margin-bottom: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    min-height: 300px;
    resize: vertical;
}

label {
    font-weight: bold;
    display: block;
}

.file-upload {
    border: 3px dashed #9b70e8;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    margin: 10px 0 20px;
    background: #faf7ff;
}

.file-upload input {
    border: none;
    padding: 10px;
    margin: 0;
}

.cover-preview {
    display: none;
    max-width: 180px;
    max-height: 240px;
    margin: 15px auto;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.primary {
    background: #7139df;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 11px;
    font-weight: bold;
    cursor: pointer;
}

.primary:hover {
    background: #5423b7;
}

.close {
    background: #777;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 10px;
    margin-left: 5px;
    cursor: pointer;
}

.message {
    font-weight: bold;
}

.success {
    color: green;
}

.error {
    color: red;
}

#reader {
    display: none;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    margin-bottom: 30px;
}

#reader h2 {
    color: #7139df;
    font-size: 32px;
}

#readerAuthor {
    color: #666;
    font-size: 18px;
    margin-bottom: 25px;
}

#readerText {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 18px;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 35px;
    margin-top: 60px;
}

@media(max-width:600px) {
    header h1 {
        font-size: 35px;
    }

    .book img {
        height: 260px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Lolo's Bookstore</h1>
    <p>Discover amazing books!</p>
</header>

<nav>
    <button onclick="showOwnerLogin()">
        🔐 My Book Studio
    </button>
</nav>

<div class="container">

<!-- PASSWORD -->

<div id="passwordPanel" class="panel">

    <h2>🔐 Owner Area</h2>

    <p>
        Enter the password to create a book.
    </p>

    <input
        id="password"
        type="password"
        placeholder="Password"
        onkeydown="if(event.key==='Enter') checkPassword()"
    >

    <button class="primary" onclick="checkPassword()">
        Enter
    </button>

    <button class="close" onclick="closePassword()">
        Cancel
    </button>

    <p id="passwordMessage" class="message"></p>

</div>


<!-- BOOK STUDIO -->

<div id="studio" class="panel">

    <h2>✍️ Create Your Own Book</h2>

    <p>
        Make your book and add it to your bookstore!
    </p>

    <label>
        📖 Book Title
    </label>

    <input
        id="title"
        type="text"
        placeholder="Enter your book title"
    >

    <label>
        ✍️ Author
    </label>

    <input
        id="author"
        type="text"
        placeholder="Who made this book?"
    >

    <label>
        💰 Book Price
    </label>

    <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Example: 5"
    >

    <label>
        🖼️ Upload Book Cover
    </label>

    <div class="file-upload">

        <p>
            📷 Choose a picture from your computer
        </p>

        <input
            id="image"
            type="file"
            accept="image/*"
            onchange="previewCover()"
        >

        <img
            id="coverPreview"
            class="cover-preview"
            alt="Cover preview"
        >

    </div>

    <label>
        ✍️ Write Your Book
    </label>

    <textarea
        id="bookText"
        placeholder="Start writing your book here...

Chapter 1

Once upon a time...

Chapter 2

..."
    ></textarea>

    <button class="primary" onclick="createBook()">
        📚 Add My Book
    </button>

    <button class="close" onclick="cancelStudio()">
        Cancel
    </button>

    <p id="addMessage" class="message"></p>

</div>


<!-- BOOK READER -->

<div id="reader">

    <h2 id="readerTitle"></h2>

    <div id="readerAuthor"></div>

    <p id="readerText"></p>

    <button class="close" onclick="closeReader()">
        ← Back to Store
    </button>

</div>


<!-- STORE -->

<h2 class="section-title">
    📚 Books For Sale
</h2>

<div id="books" class="books"></div>

</div>


<footer>

    <h2>📚 Lolo's Bookstore</h2>

    <p>Made with ❤️</p>

    <p>💬 Orders are made through WhatsApp</p>

</footer>


<script>

/* =========================================
   WHATSAPP
========================================= */

const WHATSAPP_NUMBER = "201026103853";


/* =========================================
   BOOKS
========================================= */

let books = [];

/* =========================================
   DISPLAY BOOKS
========================================= */

function displayBooks() {

    const container =
        document.getElementById("books");

    container.innerHTML = "";

    if (books.length === 0) {

        container.innerHTML = `
            <div style="text-align:center;">
                <h2>📚 No books yet!</h2>
                <p>Create your first book!</p>
            </div>
        `;

        return;
    }

    books.forEach((book, index) => {

        const card =
            document.createElement("div");

        card.className = "book";

        card.innerHTML = `

            <img
                src="${escapeHTML(book.image)}"
                alt="${escapeHTML(book.title)}"
                onerror="
                this.src='https://via.placeholder.com/600x800?text=Book'
                "
            >

            <h2>
                ${escapeHTML(book.title)}
            </h2>

            <div class="author">
                ✍️ By: ${escapeHTML(book.author || "Unknown")}
            </div>

            <div class="price">
                $${Number(book.price).toFixed(2)}
            </div>

            <button
                class="buy"
                onclick="buyBook(${index})"
            >
                💬 Buy on WhatsApp
            </button>

            <button
                class="read"
                onclick="readBook(${index})"
            >
                📖 Read Book
            </button>

            <button
                class="delete"
                onclick="deleteBook(${index})"
            >
                🗑️ Delete
            </button>
        `;

        container.appendChild(card);

    });
}


/* =========================================
   PASSWORD
========================================= */

function showOwnerLogin() {

    document.getElementById(
        "passwordPanel"
    ).style.display = "block";

    document.getElementById(
        "password"
    ).focus();
}


function closePassword() {

    document.getElementById(
        "passwordPanel"
    ).style.display = "none";

}


function checkPassword() {

    const password =
        document.getElementById(
            "password"
        ).value;

    const message =
        document.getElementById(
            "passwordMessage"
        );


    if (password === "book") {

        document.getElementById(
            "passwordPanel"
        ).style.display = "none";

        document.getElementById(
            "studio"
        ).style.display = "block";

        document.getElementById(
            "password"
        ).value = "";

        message.textContent = "";

    } else {

        message.className =
            "message error";

        message.textContent =
            "❌ Wrong password!";

    }
}


/* =========================================
   COVER PREVIEW
========================================= */

function previewCover() {

    const file =
        document.getElementById(
            "image"
        ).files[0];

    const preview =
        document.getElementById(
            "coverPreview"
        );

    if (!file) {

        preview.style.display = "none";
        return;
    }

    if (!file.type.startsWith("image/")) {

        alert("Please choose an image file.");

        document.getElementById(
            "image"
        ).value = "";

        preview.style.display = "none";

        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(event) {

            preview.src =
                event.target.result;

            preview.style.display =
                "block";
        };

    reader.readAsDataURL(file);
}


/* =========================================
   CREATE BOOK
========================================= */
async function compressImage(file) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        const reader = new FileReader();

        reader.onload = function(event) {

            img.onload = function() {

                const canvas =
                    document.createElement("canvas");

                const maxSize = 500;

                let width = img.width;
                let height = img.height;

                if (width > height) {

                    if (width > maxSize) {
                        height =
                            height * maxSize / width;
                        width = maxSize;
                    }

                } else {

                    if (height > maxSize) {
                        width =
                            width * maxSize / height;
                        height = maxSize;
                    }
                }

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        0.7
                    )
                );
            };

            img.onerror = reject;

            img.src = event.target.result;
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}
async function createBook() {

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const author =
        document.getElementById(
            "author"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "price"
            ).value
        );

    const imageFile =
        document.getElementById(
            "image"
        ).files[0];

    const bookText =
        document.getElementById(
            "bookText"
        ).value.trim();

    const message =
        document.getElementById(
            "addMessage"
        );


    if (!title) {

        showError(
            message,
            "❌ Give your book a title."
        );

        return;
    }


    if (!author) {

        showError(
            message,
            "❌ Enter the author's name."
        );

        return;
    }


    if (price <= 0) {

        showError(
            message,
            "❌ Give your book a price."
        );

        return;
    }


if (!imageFile) {

    message.className =
        "message error";

    message.textContent =
        "❌ Upload a book cover.";

    return;
}
const compressedImage =
    await compressImage(imageFile);
    if (!bookText) {

        showError(
            message,
            "❌ Write your book."
        );

        return;
    }


    const reader =
        new FileReader();

reader.onload =
    async function(event) {

const newBook = {
    title: title,
    author: author,
    price: price,
image: compressedImage,
    text: bookText
};

const savedId = await saveBookToFirebase(newBook);

if (!savedId) {
    return;
}

newBook.id = savedId;

books.push(newBook);

displayBooks();


            /* CLEAR THE FORM */

            document.getElementById(
                "title"
            ).value = "";

            document.getElementById(
                "author"
            ).value = "";

            document.getElementById(
                "price"
            ).value = "";

            document.getElementById(
                "image"
            ).value = "";

            document.getElementById(
                "bookText"
            ).value = "";

            document.getElementById(
                "coverPreview"
            ).style.display = "none";


            /*
             IMPORTANT:
             CLOSE THE BOOK STUDIO
             AFTER ONE BOOK IS ADDED.
             */

            document.getElementById(
                "studio"
            ).style.display = "none";


            message.className =
                "message success";

            message.textContent =
                "🎉 Your book was added!";


            /*
             The password is NOT saved.
             To create another book,
             the user must enter the
             password again.
             */

            alert(
                "🎉 Your book has been added!\n\n🔐 Enter the password again if you want to make another book."
            );

        };


    reader.readAsDataURL(imageFile);
}


/* =========================================
   ERROR MESSAGE
========================================= */

function showError(element, text) {

    element.className =
        "message error";

    element.textContent =
        text;
}


/* =========================================
   CANCEL STUDIO
========================================= */

function cancelStudio() {

    document.getElementById(
        "studio"
    ).style.display = "none";

    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "author"
    ).value = "";

    document.getElementById(
        "price"
    ).value = "";

    document.getElementById(
        "image"
    ).value = "";

    document.getElementById(
        "bookText"
    ).value = "";

    document.getElementById(
        "coverPreview"
    ).style.display = "none";

}


/* =========================================
   READ BOOK
========================================= */

function readBook(index) {

    const book =
        books[index];

    document.getElementById(
        "readerTitle"
    ).textContent =
        book.title;

    document.getElementById(
        "readerAuthor"
    ).textContent =
        "✍️ By: " +
        (book.author || "Unknown");

    document.getElementById(
        "readerText"
    ).textContent =
        book.text;

    document.getElementById(
        "reader"
    ).style.display =
        "block";

    document.getElementById(
        "books"
    ).style.display =
        "none";

    document.querySelector(
        ".section-title"
    ).style.display =
        "none";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function closeReader() {

    document.getElementById(
        "reader"
    ).style.display =
        "none";

    document.getElementById(
        "books"
    ).style.display =
        "grid";

    document.querySelector(
        ".section-title"
    ).style.display =
        "block";
}


/* =========================================
   DELETE BOOK
========================================= */

async function deleteBook(id) {

    if (!id) {
        console.error("❌ No book ID was provided.");
        return;
    }

    const confirmed = confirm(
        "🗑️ Are you sure you want to delete this book?"
    );

    if (!confirmed) {
        return;
    }

    try {

        await deleteDoc(
            doc(db, "books", id)
        );

        console.log(
            "🗑️ Book deleted from Firebase:",
            id
        );

        // Remove it from the local array
        books = books.filter(
            book => book.id !== id
        );

        // Refresh the books on screen
        displayBooks();

        alert("✅ Book deleted!");

    } catch (error) {

        console.error(
            "❌ Could not delete book:",
            error
        );

        alert(
            "❌ The book could not be deleted."
        );
    }
}


/* =========================================
   SAVE BOOKS
========================================= */

window.saveBookToFirebase = async function(book) {

    try {

        const docRef = await addDoc(
            collection(db, "books"),
            {
                title: book.title,
                author: book.author,
                price: Number(book.price),
                text: book.text,
                image: book.image
            }
        );

        console.log(
            "📚 Book saved!",
            docRef.id
        );

        return docRef.id;

    } catch (error) {

        console.error(
            "❌ Could not save book:",
            error
        );

        alert(
            "❌ The book could not be saved."
        );

        return null;
    }
};
/* =========================================
   WHATSAPP
========================================= */

function buyBook(index) {

    const book =
        books[index];

    const message =

`📚 BOOK ORDER

Book: ${book.title}

Author: ${book.author}

Price: $${Number(book.price).toFixed(2)}

Hello! I would like to buy this book.`;


    const whatsappURL =

        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        whatsappURL,
        "_blank"
    );
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================
   START
========================================= */

displayBooks();

</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4yrEl32I9HVGt7nLy0Cd6XuRvk3pWgEo",
  authDomain: "lolo-s-bookstore.firebaseapp.com",
  projectId: "lolo-s-bookstore",
  storageBucket: "lolo-s-bookstore.firebasestorage.app",
  messagingSenderId: "610405320877",
  appId: "1:610405320877:web:67b85d346f366793c31e24",
  measurementId: "G-R0QKJMTMTF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function loadBooksFromFirebase() {

    try {

        const booksSnapshot =
            await getDocs(
                collection(db, "books")
            );

        books = [];

        booksSnapshot.forEach((bookDoc) => {

            const book =
                bookDoc.data();

            books.push({
                id: bookDoc.id,
                title: book.title || "Untitled",
                author: book.author || "Unknown",
                price: Number(book.price) || 0,
                text: book.text || "",
                image: book.image || ""
            });

        });

        displayBooks();

        console.log(
            "📚 Books loaded from Firebase:",
            books
        );

    } catch (error) {

        console.error(
            "❌ Could not load books:",
            error
        );

    }
}

loadBooksFromFirebase();
window.saveBookToFirebase = async function(book) {

    try {

        const docRef = await addDoc(
            collection(db, "books"),
            {
                title: book.title,
                author: book.author,
                price: Number(book.price),
                text: book.text,
                image: book.image
            }
        );

        console.log(
            "📚 Book saved!",
            docRef.id
        );

        return docRef.id;

    } catch (error) {

        console.error(
            "❌ Could not save book:",
            error
        );

        alert(
            "❌ The book could not be saved."
        );

        return null;
    }
};
console.log("🔥 Firebase connected!");
</script>
</body>
</html>
